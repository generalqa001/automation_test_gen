<!doctype html><html><head><meta charset="UTF-8"><title>Cart</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">AI QA Shop</a><nav><a href="/products.html">Products</a><a href="/profile.html">Profile</a></nav></header><main><h1>Your Cart</h1><div id="cart" class="panel"></div></main><script>Promise.all([fetch('/api/products').then(r=>r.json())]).then(([ps])=>{const ids=JSON.parse(localStorage.getItem('cart')||'[]');const selected=ps.filter(p=>ids.includes(p.id));document.querySelector('#cart').innerHTML=selected.length?selected.map(p=>`<p><b>${p.name}</b> - $${p.price}</p>`).join('')+'<a class="button" href="/checkout.html">Checkout</a>':'<p>Your cart is empty.</p>'});</script></body></html>
