<!doctype html><html><head><meta charset="UTF-8"><title>AI Tester</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">AI QA Shop</a><nav><a href="/">Home</a></nav></header><main><section class="panel form"><h1>AI Test Console</h1><p class="muted">Use this page to exercise prompts and validate AI responses.</p><textarea id="prompt" rows="8" placeholder="Ask the AI something..."></textarea><button id="send" class="button">Send</button><div id="response" class="message"></div></section></main><script>document.querySelector('#send').onclick=async()=>{const prompt=document.querySelector('#prompt').value;const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await r.json();document.querySelector('#response').textContent=d.response||d.message};</script></body></html>
