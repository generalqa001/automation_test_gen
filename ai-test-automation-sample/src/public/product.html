<!doctype html><html><head><meta charset="UTF-8"><title>Product Details</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">AI QA Shop</a><nav><a href="/products.html">Products</a><a href="/cart.html">Cart</a></nav></header><main><div id="product" class="panel"></div></main><script>const id=Number(new URLSearchParams(location.search).get('id'));fetch('/api/products').then(r=>r.json()).then(ps=>{const p=ps.find(x=>x.id===id);document.querySelector('#product').innerHTML=p?`<h1>${p.name}</h1><p>${p.description}</p><p class="price">$${p.price}</p><p>Stock: ${p.stock}</p><button id="add" class="button">Add to cart</button>`:'<h1>Product not found</h1>';document.querySelector('#add')?.addEventListener('click',()=>{const c=JSON.parse(localStorage.getItem('cart')||'[]');c.push(id);localStorage.setItem('cart',JSON.stringify(c));location.href='/cart.html';})});</script></body></html>
