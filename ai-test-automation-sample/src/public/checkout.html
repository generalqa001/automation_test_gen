<!doctype html><html><head><meta charset="UTF-8"><title>Checkout</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">AI QA Shop</a></header><main><section class="panel form"><h1>Checkout</h1><form id="checkout"><label>Full name</label><input data-testid="name" required><label>Address</label><input data-testid="address" required><label>Card</label><input data-testid="card" minlength="12" required><button class="button">Place order</button></form><div id="message"></div></section></main><script>document.querySelector('#checkout').addEventListener('submit',e=>{e.preventDefault();localStorage.removeItem('cart');document.querySelector('#message').className='message success';document.querySelector('#message').textContent='Order placed successfully';});</script></body></html>
