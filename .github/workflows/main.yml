name: Job Dependecies 
on: 
    workflow_dispatch:
jobs: 
    greeting-inline-bash:
        runs-on: ubuntu-22.04
        steps:
          - run: echo "Hello World" 
          - run: echo $PATH 
    job-2: 
          runs-on : ubuntu-24.04
          needs:
            - greeting-inline-bash
          steps:
          - run: echo "running job-2 dep on job 1" 
    job-3: 
          runs-on: windows-2025
          needs: 
          - greeting-inline-bash
          - job-2
          steps:
          - run: echo "running job 3 dep on job 1 and 2" 
    job-4: 
        runs-on: macos-13
        needs:
        - job-2
        steps:
          - run: echo "job-4 dep on job-2 only" 
